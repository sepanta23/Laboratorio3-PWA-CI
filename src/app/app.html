<div class="container my-4" style="max-width: 600px;">
  <div class="card shadow">

    <!-- Encabezado -->
    <div class="card-header bg-success text-white text-center py-3">
      <h3 class="mb-0">Mi Lista de Tareas PWA</h3>
      <small>Aplicación web progresiva · Angular + Bootstrap</small>
    </div>

    <div class="card-body">

      <!-- Estado de conexión -->
      <p class="mb-3">
        Estado de conexión:
        <strong [class.text-success]="enLinea()" [class.text-danger]="!enLinea()">
          {{ enLinea() ? 'En línea' : 'Sin conexión' }}
        </strong>
      </p>

      <!-- Formulario para agregar tarea -->
      <div class="input-group mb-4">
        <input
          type="text"
          class="form-control"
          placeholder="Escribe una nueva tarea..."
          [(ngModel)]="nuevaTarea"
          (keyup.enter)="agregarTarea()"
        />
        <button class="btn btn-primary" (click)="agregarTarea()">Agregar</button>
      </div>

      <!-- Lista de tareas -->
      <ul class="list-group">
        @for (tarea of tareas(); track tarea.id) {
          <li
            class="list-group-item d-flex justify-content-between align-items-center"
            [class.list-group-item-success]="tarea.completada"
          >
            <span
              [class.text-decoration-line-through]="tarea.completada"
              (click)="alternarCompletada(tarea.id)"
              style="cursor: pointer;"
            >
              {{ tarea.texto }}
            </span>
            <button class="btn btn-sm btn-outline-danger" (click)="eliminarTarea(tarea.id)">
              Eliminar
            </button>
          </li>
        }
      </ul>

    </div>

    <!-- Pie de página -->
    <div class="card-footer text-center text-muted">
      Laboratorio 6 · PWA con Angular y Bootstrap | ESPE
    </div>

  </div>
</div>
